name: Release Please

# Track 1 — Entwickler-CHANGELOG.md aus Conventional Commits.
# release-please pflegt einen Release-PR: er sammelt die feat/fix/perf-Commits,
# schreibt CHANGELOG.md fort und schlägt die nächste Version vor. Merge des PRs
# erzeugt Tag + GitHub-Release. Kein DB-Zugriff, keine Secrets — nutzt den
# eingebauten GITHUB_TOKEN.
#
# Das Produkt-„Was ist neu" (Appwrite-Tabelle) ist davon getrennt und wird
# kuratiert befüllt (siehe packages/admin/scripts/changelog-draft.mjs).
#
# ── NICHT MEHR BEI JEDEM PUSH (Davids Entscheidung, 2026-08-18) ─────────────
# In der Nacht auf den 18. ist der Lauf mit `API rate limit exceeded for
# INSTALLATION` gestorben — nicht am Code und nicht am Token eines Menschen,
# sondern am Kontingent der App-Installation: mehrere Sitzungen schoben im
# Minutentakt, und jeder Push startete einen eigenen release-please-Lauf, der
# die Historie neu liest. Ein rotes Gate, das nichts über den Code aussagt,
# ist schlimmer als keins — es stumpft ab.
#
# Der Lauf ist deshalb an die drei Anlässe gebunden, bei denen er wirklich
# etwas zu tun hat:
#
#  1. `.release-please-manifest.json` ändert sich auf main. DAS IST DER MERGE
#     DER RELEASE-PR — der einzige Push, der SOFORT laufen muss, weil erst
#     dieser Lauf Tag und GitHub-Release erzeugt. Ein gewöhnlicher Commit
#     fasst die Datei nie an; release-please schreibt sie ausschließlich
#     selbst.
#  2. Einmal täglich. Der Release-PR ist ein SAMMLER: ob er einen Commit
#     sofort oder heute Nacht aufnimmt, ändert an seinem Inhalt nichts — er
#     liest ohnehin jedes Mal die ganze Historie seit dem letzten Tag.
#  3. Von Hand (`workflow_dispatch`), wenn jemand vor einem Release den
#     aktuellen Stand im PR sehen will, statt bis zum nächsten Tag zu warten.
#
# WAS DAS KOSTET, ehrlich gesagt: der Release-PR hinkt bis zu einen Tag
# hinterher. Er ist ein Entwurf, den niemand liest, bevor released wird — und
# der Knopf für „jetzt sofort" steht direkt daneben.

on:
  push:
    branches: [main]
    paths:
      - '.release-please-manifest.json'
  schedule:
    # 04:17 UTC — versetzt zum halbstündlichen TLS-Wächter, damit sich die
    # beiden nicht im selben Minutenfenster um die API-Kontingente streiten.
    - cron: '17 4 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

# Ein Lauf zur Zeit, und ein laufender wird NIE abgebrochen: er kann mitten im
# Anlegen eines Tags oder eines GitHub-Releases stehen.
concurrency:
  group: release-please
  cancel-in-progress: false

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - uses: googleapis/release-please-action@v5
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
