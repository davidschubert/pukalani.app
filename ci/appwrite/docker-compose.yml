# ── CI-WEGWERF-APPWRITE (E2E) ───────────────────────────────────────────────
# ABGELEITET vom offiziellen Compose der Version aus ci.env (_APP_VERSION).
# Vorlage ist die Datei, die `appwrite upgrade` auf der Entwicklungs-Instanz
# erzeugt (~/Developer/orbstack/appwrite-maria/appwrite/docker-compose.yml) —
# eine neue Appwrite-Version hebt man hier, indem man diese Vorlage erneut
# durch die VIER CI-Abweichungen schickt, nicht indem man von Hand nachpflegt:
#
#  1. KEIN `container_name:` — feste Namen (`appwrite`, `appwrite-redis`, …)
#     kollidieren mit der lokalen Entwicklungs-Instanz, sobald jemand den
#     CI-Stack zum Nachstellen auf demselben Rechner startet.
#  2. NETZE HEISSEN `-ci` (gateway-ci / appwrite-ci / runtimes-ci). Das
#     offizielle Compose vergibt globale Netz-Namen; zwei Stacks landeten damit
#     im SELBEN Docker-Netz, und `mariadb`/`redis`/`appwrite` wären dort
#     doppelt vergebene DNS-Namen.
#  3. `traefik.constraint-label-stack=appwrite-ci` (Label UND traefik-
#     Constraint). Beide traefik lesen denselben Docker-Socket: mit dem
#     Original-Label würde der traefik der ENTWICKLUNGS-Instanz die
#     CI-Container in seine Router aufnehmen und Anfragen auf Port 80
#     zwischen beiden Appwrites verteilen. Das ist keine Theorie — es ist der
#     Grund, warum diese Datei eigene Namen trägt.
#  4. Volume `appwrite-builds` OHNE festen `name:` (sonst teilen sich CI und
#     Entwicklung dasselbe Volume).
#
# GESTARTET wird nur ein Ausschnitt — die Liste steht in
# .github/workflows/e2e.yml („Appwrite-Stack starten"). Der Rest der Dienste
# bleibt bewusst in der Datei: so ist der nächste Versionshub ein erneutes
# Ableiten und kein Zusammensuchen.
x-logging:
  logging:
    driver: json-file
    options:
      max-file: "5"
      max-size: 10m
services:
  traefik:
    image: traefik:3.6
    logging:
      driver: json-file
      options:
        max-file: "5"
        max-size: 10m
    command:
    - --providers.file.directory=/storage/config
    - --providers.file.watch=true
    - --providers.docker=true
    - --providers.docker.exposedByDefault=false
    - --providers.docker.constraints=Label(`traefik.constraint-label-stack`,`appwrite-ci`)
    - --entrypoints.appwrite_web.address=:80
    - --entrypoints.appwrite_websecure.address=:443
    ports:
    - ${_APP_HTTP_PORT:-80}:80
    - ${_APP_HTTPS_PORT:-443}:443
    volumes:
    - /var/run/docker.sock:/var/run/docker.sock
    - appwrite-config:/storage/config:ro
    - appwrite-certificates:/storage/certificates:ro
    depends_on:
    - appwrite
    networks:
    - gateway
    - appwrite
  appwrite:
    logging:
      driver: json-file
      options:
        max-file: "5"
        max-size: 10m
    image: ${_APP_IMAGE:-appwrite/appwrite}:${_APP_VERSION:-latest}
    healthcheck:
      # NICHT 'doctor' verwenden: appwrite doctor verschickt bei jedem Lauf
      # eine "Test SMTP Connection"-Mail (spammt Mailpit alle 5s zu)
      test:
      - CMD-SHELL
      - 'curl -fsS -o /dev/null -H "Host: $${_APP_DOMAIN:-localhost}" http://localhost/v1/health/version'
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 120s
    networks:
    - appwrite
    labels:
    - traefik.enable=true
    - traefik.constraint-label-stack=appwrite-ci
    - traefik.docker.network=appwrite-ci
    - traefik.http.services.appwrite_api.loadbalancer.server.port=80
    - traefik.http.routers.appwrite_api_http.entrypoints=appwrite_web
    - traefik.http.routers.appwrite_api_http.rule=PathPrefix(`/`)
    - traefik.http.routers.appwrite_api_http.service=appwrite_api
    - traefik.http.routers.appwrite_api_https.entrypoints=appwrite_websecure
    - traefik.http.routers.appwrite_api_https.rule=PathPrefix(`/`)
    - traefik.http.routers.appwrite_api_https.service=appwrite_api
    - traefik.http.routers.appwrite_api_https.tls=true
    volumes:
    - appwrite-uploads:/storage/uploads:rw
    - appwrite-imports:/storage/imports:rw
    - appwrite-cache:/storage/cache:rw
    - appwrite-config:/storage/config:rw
    - appwrite-certificates:/storage/certificates:rw
    - appwrite-functions:/storage/functions:rw
    - appwrite-sites:/storage/sites:rw
    - appwrite-builds:/storage/builds:rw
    depends_on:
      redis:
        condition: service_started
      appwrite-geo:
        condition: service_started
      mariadb:
        condition: service_healthy
    environment:
    - _APP_ENV
    - _APP_USAGE_STATS
    - _APP_USAGE_PASS
    - _APP_CONNECTIONS_DB_USAGE
    - _APP_POOL_SIZE_USAGE
    - _APP_EXECUTIONS_DUAL_WRITE
