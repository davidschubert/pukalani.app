  appwrite-console:
    logging:
      driver: json-file
      options:
        max-file: "5"
        max-size: 10m
    image: appwrite/new:1.1.16
    restart: unless-stopped
    networks:
    - appwrite
    environment:
    - VITE_CONSOLE_PROFILE=self-hosted
    - APPWRITE_ENDPOINT_SAME_ORIGIN=true
    - VITE_GROWTH_ENDPOINT=https://growth.appwrite.io/v1
    labels:
    - traefik.enable=true
    - traefik.constraint-label-stack=appwrite-ci
    - traefik.docker.network=appwrite-ci
    - traefik.http.services.appwrite_console.loadbalancer.server.port=3000
    - traefik.http.routers.appwrite_console_http.entrypoints=appwrite_web
    - traefik.http.routers.appwrite_console_http.rule=(Host(`${_APP_DOMAIN:-localhost}`)
      || Host(`${_APP_CONSOLE_DOMAIN:-localhost}`)) && !PathPrefix(`/v1`) && !PathPrefix(`/.well-known`)
      && !HeaderRegexp(`x-appwrite-hostname`, `.+`)
    - traefik.http.routers.appwrite_console_http.service=appwrite_console
    - traefik.http.routers.appwrite_console_https.entrypoints=appwrite_websecure
    - traefik.http.routers.appwrite_console_https.rule=(Host(`${_APP_DOMAIN:-localhost}`)
      || Host(`${_APP_CONSOLE_DOMAIN:-localhost}`)) && !PathPrefix(`/v1`) && !PathPrefix(`/.well-known`)
      && !HeaderRegexp(`x-appwrite-hostname`, `.+`)
    - traefik.http.routers.appwrite_console_https.service=appwrite_console
    - traefik.http.routers.appwrite_console_https.tls=true
